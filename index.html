<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroFolio | Web3 Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h1 style="margin: 0; font-size: 24px; font-weight: 700;">Aero<span style="color: #60a5fa;">Folio</span></h1>
            
            <div id="authPanel">
                <button id="loginBtn" class="btn-primary" style="color: white; border-color: rgba(255,255,255,0.2);">Google Login</button>
                <button id="logoutBtn" class="btn-primary" style="display: none; border-color: rgba(239, 68, 68, 0.3); color: #f87171;">Logout</button>
            </div>
        </header>

        <div id="appContainer" style="display: none;">
            
            <nav class="tab-nav">
                <button class="tab-btn active" onclick="window.switchTab('airdropTab', this)">Airdrop Tracker</button>
                <button class="tab-btn" onclick="window.switchTab('tradingTab', this)">Trading Journal</button>
            </nav>

            <!-- TAB 1: AIRDROP TRACKER -->
            <div id="airdropTab" class="tab-content active">
                <section class="analytics-dashboard" style="display: flex; gap: 16px; margin-bottom: 24px;">
                    <div id="cardAll" class="metric-card" onclick="window.setFilter('All')">
                        <h4>Total Portfolio</h4>
                        <h2 id="metricTotal">0</h2>
                    </div>
                    <div id="cardActive" class="metric-card" onclick="window.setFilter('Active')">
                        <h4>Active / Grinding</h4>
                        <h2 id="metricActive">0</h2>
                    </div>
                    <div id="cardDoneToday" class="metric-card" onclick="window.setFilter('DoneToday')">
                        <h4>Completed Today</h4>
                        <h2 id="metricDoneToday">0</h2>
                    </div>
                    <div id="cardClaimable" class="metric-card" onclick="window.setFilter('Claimable')">
                        <h4>Claimable</h4>
                        <h2 id="metricClaimable">0</h2>
                    </div>
                </section>

                <section class="control-panel" style="flex-wrap: wrap;">
                    <input type="text" id="projectName" class="form-input" placeholder="Project Name (e.g., ZkSync)" required style="flex: 1 1 20%;">
                    <input type="url" id="projectUrl" class="form-input" placeholder="Website URL (Optional)" style="flex: 1 1 20%;">
                    <input type="url" id="referralLink" class="form-input" placeholder="Referral Link (Optional)" style="flex: 1 1 20%;">
                    
                    <select id="projectCategory" class="form-input" style="flex: 1 1 12%;">
                        <option value="Testnet">Testnet</option>
                        <option value="Retroactive">Retroactive</option>
                        <option value="Whitelist">Whitelist</option>
                        <option value="Node">Node Running</option>
                        <option value="Social Quest">Social Quest</option>
                    </select>
                    
                    <div style="flex: 1 1 12%; display: flex; gap: 8px;">
                        <select id="network" class="form-input" style="flex: 1;">
                            <option value="">Select Network...</option>
                            <option value="_add_new_">+ Add New</option>
                        </select>
                        <button id="delNetworkBtn" style="display: none; background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; border-radius: 12px; padding: 0 12px;">X</button>
                    </div>
                    
                    <div style="flex: 1 1 12%; display: flex; gap: 8px;">
                        <select id="wallet" class="form-input" style="flex: 1;">
                            <option value="">Select Wallet...</option>
                            <option value="_add_new_">+ Add New</option>
                        </select>
                        <button id="delWalletBtn" style="display: none; background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; border-radius: 12px; padding: 0 12px;">X</button>
                    </div>
                    
                    <select id="taskFrequency" class="form-input" style="flex: 1 1 12%;">
                        <option value="One-Time">One-Time</option>
                        <option value="Daily">Daily</option>
                        <option value="Weekly">Weekly</option>
                        <option value="Monthly">Monthly</option>
                    </select>
                    
                    <button id="addProjectBtn" class="btn-primary" style="flex: 1 1 100%;">Deploy Project Tracker</button>
                </section>

                <section id="networkFilterContainer" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 24px;"></section>
                <section class="data-view">
                    <div id="projectList" class="grid-layout"></div>
                </section>
            </div>

            <!-- TAB 2: TRADING JOURNAL -->
            <div id="tradingTab" class="tab-content">
                
                <!-- Capital & Performance Dashboard -->
                <section class="analytics-dashboard" style="display: flex; gap: 16px; margin-bottom: 24px;">
                    <div class="metric-card" style="flex: 1.5; text-align: left; position: relative;">
                        <h4 style="margin-bottom: 5px;">Portfolio Capital</h4>
                        <div style="display: flex; align-items: baseline; gap: 10px;">
                            <h2 id="metricCurrentCapital" style="margin: 0;">$0.00</h2>
                            <span id="metricCapitalDelta" style="font-size: 13px; font-weight: 600;">(+$0.00)</span>
                        </div>
                        <div style="margin-top: 15px; display: flex; gap: 8px;">
                            <input type="number" id="inputInitialCapital" class="form-input" placeholder="Set Initial Capital ($)" style="padding: 6px 12px; font-size: 12px; width: 140px;">
                            <button onclick="window.saveInitialCapital()" style="background: transparent; border: 1px solid var(--border-blue-subtle); color: var(--text-secondary); border-radius: 8px; cursor: pointer; padding: 0 10px; font-size: 12px;">Save</button>
                        </div>
                    </div>
                    <div class="metric-card" style="flex: 1;">
                        <h4>Win Rate</h4>
                        <h2 id="metricWinRate">0%</h2>
                        <p id="metricSystemEval" style="font-size: 11px; margin: 8px 0 0 0; color: var(--text-secondary);"></p>
                    </div>
                    <div class="metric-card" style="flex: 1;">
                        <h4>Closed Trades</h4>
                        <h2 id="metricTotalTrades">0</h2>
                    </div>
                </section>

                <section class="control-panel" style="flex-wrap: wrap;">
                    <input type="text" id="tradePair" class="form-input" placeholder="Pair (e.g., BTC/USDT)" required style="flex: 1 1 15%;">
                    
                    <select id="tradePosition" class="form-input" style="flex: 1 1 12%;">
                        <option value="LONG">Long</option>
                        <option value="SHORT">Short</option>
                        <option value="SPOT">Spot</option>
                    </select>
                    
                    <input type="number" id="tradeMargin" class="form-input" placeholder="Margin/Size ($)" step="any" required style="flex: 1 1 12%;">
                    <input type="number" id="tradeLeverage" class="form-input" placeholder="Leverage" style="flex: 1 1 10%;">
                    <input type="number" id="tradeEntry" class="form-input" placeholder="Entry Price" step="any" required style="flex: 1 1 15%;">
                    <input type="number" id="tradeExit" class="form-input" placeholder="Exit Price (Optional)" step="any" style="flex: 1 1 15%;">
                    <input type="text" id="tradeSetup" class="form-input" placeholder="Setup / Entry Reason" style="flex: 1 1 100%;">
                    
                    <button id="addTradeBtn" class="btn-primary" style="flex: 1 1 100%;">Execute Trade Journal</button>
                </section>
                
                <section class="data-view">
                    <div id="tradingList" class="grid-layout"></div>
                </section>
            </div>
        </div>
    </div>

    <script>
        window.switchTab = function(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => { tab.style.display = 'none'; });
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('active'); });
            document.getElementById(tabId).style.display = 'block';
            btnElement.classList.add('active');
        };
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
